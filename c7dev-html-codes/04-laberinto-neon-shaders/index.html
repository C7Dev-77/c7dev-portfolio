  <!-- Shaders GLSL -->
  <script type="x-shader/x-vertex" id="shader-passthrough-vertex">
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  </script>

  <script type="x-shader/x-fragment" id="shader-passthrough-fragment">
    uniform sampler2D tDiffuse;
    varying vec2 vUv;
    void main() {
      gl_FragColor = texture2D(tDiffuse, vUv);
    }
  </script>

  <script type="x-shader/x-fragment" id="shader-volumetric-light-fragment">
    varying vec2 vUv;
    uniform sampler2D tDiffuse;
    uniform vec2 lightPosition;
    uniform float exposure;
    uniform float decay;
    uniform float density;
    uniform float weight;
    uniform int samples;
    const int MAX_SAMPLES = 100;
    void main() {
      vec2 texCoord = vUv;
      vec2 deltaTextCoord = (texCoord - lightPosition) * (1.0 / float(samples) * density);
      vec4 color = texture2D(tDiffuse, texCoord);
      float illuminationDecay = 1.0;
      for(int i = 0; i < MAX_SAMPLES; i++) {
        if(i == samples) break;
        texCoord -= deltaTextCoord;
        vec4 sampleColor = texture2D(tDiffuse, texCoord);
        sampleColor *= illuminationDecay * weight;
        color += sampleColor;
        illuminationDecay *= decay;
      }
      gl_FragColor = color * exposure;
    }
  </script>

  <script type="x-shader/x-fragment" id="shader-additive-fragment">
    uniform sampler2D tDiffuse;
    uniform sampler2D tAdd;
    varying vec2 vUv;
    void main() {
      vec4 color = texture2D(tDiffuse, vUv);
      vec4 add = texture2D(tAdd, vUv);
      gl_FragColor = color + add;
    }
  </script>

  <!-- Dependencias 3D estables -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/92/three.min.js"></script>
  <script src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/204379/EffectComposer.js"></script>
  <script src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/204379/UnrealBloomPass.js"></script>
  <script src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/204379/THREE.MeshLine.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.1.3/TweenMax.min.js"></script>

  <script>
    // Perlin noise ligero autocontenido para asegurar estabilidad sin dependencias rotas
    const noise = {
      perlin2: function(x, y) {
        return Math.sin(x * 1.5) * Math.cos(y * 1.5) + Math.sin(x * 0.7 + y * 0.3) * 0.5;
      }
    };

    const CUBE_SIZE = 10;
    const MAP_WIDTH = 28;
    const MAP_HEIGHT = 31;

    const NONE = 0, UP = 1, RIGHT = 2, DOWN = 3, LEFT = 4;
    const MAP_EMPTY = 1, MAP_WALL = 2, MAP_JUNCTION = 3, MAP_DIRECTION = 4;
    const MAP_PARSE_COLORS = {
      '0,0,0': MAP_EMPTY,
      '255,0,0': MAP_WALL,
      '0,255,0': MAP_JUNCTION,
      '0,0,255': MAP_DIRECTION
    };

    class BoardMap {
      constructor(mapId) {
        this.width = 0;
        this.height = 0;
        this.tiles = [];
        this.mapImageData = this.getImageData(mapId);
        this.parseMap();
      }

      getImageData(id) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const img = document.querySelector(id);
        const { width: w, height: h } = img;
        canvas.width = w;
        canvas.height = h;
        ctx.drawImage(img, 0, 0);
        this.width = w;
        this.height = h;
        return ctx.getImageData(0, 0, w, h).data;
      }

      getMapPixelRGB(x, y) {
        const { mapImageData: data, width } = this;
        const idx = (x + width * y) * 4;
        return [
          Math.round(data[idx + 0] / 255) * 255,
          Math.round(data[idx + 1] / 255) * 255,
          Math.round(data[idx + 2] / 255) * 255
        ];
      }

      stepToDirection(x, y, direction) {
        let xTo = x, yTo = y;
        switch (direction) {
          case UP: yTo -= 1; break;
          case RIGHT: xTo += 1; break;
          case DOWN: yTo += 1; break;
          case LEFT: xTo -= 1; break;
        }
        return [xTo, yTo];
      }

      getTileAt(x, y, direction = NONE) {
        let [xTo, yTo] = this.stepToDirection(x, y, direction);
        if (x <= this.width && y <= this.height) {
          let idx = yTo * this.width + xTo;
          return this.tiles[idx];
        }
      }

      getNearestNeighborFrom(x, y, direction, type) {
        let next = this.getTileAt(x, y, direction);
        let [xTo, yTo] = this.stepToDirection(x, y, direction);
        if (next === type) {
          return [xTo, yTo];
        } else if (next) {
          return this.getNearestNeighborFrom(xTo, yTo, direction, type);
        }
      }

      getIndexFromCoords(x, y) { return y * this.width + x; }
      getCoordsFromIndex(idx) { return [idx % this.width, Math.floor(idx / this.width)]; }

      parseMap() {
        for (let y = 0; y < this.height; y++) {
          for (let x = 0; x < this.width; x++) {
            const [r, g, b] = this.getMapPixelRGB(x, y);
            this.tiles.push(MAP_PARSE_COLORS[`${r},${g},${b}`]);
          }
        }
      }
    }

    class MapBoundariesMesh {
      constructor(boardMap) {
        this.boardMap = boardMap;
        this.geometry = new THREE.Geometry();
        this.generateGeometry();
      }

      generateGeometry() {
        for (let x = 0; x < MAP_WIDTH; x++) {
          for (let y = 0; y < MAP_HEIGHT; y++) {
            let idx = y * MAP_WIDTH + x;
            if (this.boardMap.tiles[idx] === MAP_WALL) {
              this.putBlock(x, y);
            }
          }
        }
      }

      putBlock(x, y) {
        const boxWidth = CUBE_SIZE / MAP_WIDTH;
        const boxHeight = CUBE_SIZE / MAP_HEIGHT;
        const halfSize = CUBE_SIZE / 2;
        const boxElevation = 0.25;
        const geo = new THREE.BoxGeometry(boxWidth, boxElevation, boxHeight);
        const tX = -halfSize + x * boxWidth + boxWidth / 2;
        const tY = -halfSize + y * boxHeight + boxHeight / 2;
        geo.translate(tX, boxElevation / 2, tY);
        const mesh = new THREE.Mesh(geo);
        this.geometry.merge(mesh.geometry, mesh.matrix);
      }
    }

    // Partículas con textura procedural generada dinámicamente
    function createGlowTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 64;
      const g = c.getContext('2d');
      const grad = g.createRadialGradient(32, 32, 2, 32, 32, 32);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.4, 'rgba(255,0,255,0.7)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grad;
      g.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    }

    class Particles {
      constructor() {
        this.clusters = [];
        this.texture = createGlowTexture();
        this.initParticles();
      }

      initParticles() {
        for (let i = 0; i < 5; i++) {
          const cluster = {
            scale: i + 2,
            speed: THREE.Math.randFloat(0.5, 1.8),
            points: this.getCluster(110)
          };
          this.clusters.push(cluster);
        }
      }

      getCluster(count) {
        const geo = new THREE.Geometry();
        const mat = new THREE.PointsMaterial({
          color: 0xff00ff,
          size: THREE.Math.randFloat(0.12, 0.3),
          map: this.texture,
          sizeAttenuation: true,
          transparent: true,
          opacity: 0.9,
          blending: THREE.AdditiveBlending
        });

        for (let i = 0; i < count; i++) {
          let p = new THREE.Vector3(
            THREE.Math.randFloatSpread(2.5),
            THREE.Math.randFloatSpread(2.5),
            THREE.Math.randFloatSpread(2.5)
          );
          geo.vertices.push(p);
        }
        return new THREE.Points(geo, mat);
      }

      update(delta) {
        for (let i = 0; i < this.clusters.length; i++) {
          const cluster = this.clusters[i];
          if (cluster.scale > 12) {
            cluster.scale = 2;
            cluster.points.material.opacity = 1;
          }
          cluster.scale += 0.45 * delta * cluster.speed;
          cluster.points.scale.set(cluster.scale, cluster.scale, cluster.scale);
          if (cluster.scale > 8) {
            cluster.points.material.opacity = THREE.Math.lerp(1, 0, 1 - (12 - cluster.scale) / 4);
          }
        }
      }
    }

    class Trails {
      constructor(map) {
        this.group = new THREE.Object3D();
        this.position = new THREE.Vector3();
        this.map = map;
        this.maxPositions = 25;
        this.junctionTiles = [];
        this.init();
        this.spawn();
      }

      init() {
        this.geometry = new THREE.Geometry();
        const mat = new MeshLineMaterial({ color: new THREE.Color(0x00ffff), side: THREE.DoubleSide });
        this.line = new MeshLine();
        this.mesh = new THREE.Mesh(this.line.geometry, mat);
        this.group.add(this.mesh);
        for (let i = 0; i < this.maxPositions; i++) {
          this.geometry.vertices.push(new THREE.Vector3());
        }
        this.map.tiles.forEach((t, idx) => {
          if (t === MAP_JUNCTION) this.junctionTiles.push(idx);
        });
        this.light = new THREE.PointLight(0x00ffff, 1.2, 6);
        this.group.add(this.light);
      }

      spawn() {
        const wayPoints = this.getWayPoints();
        if (!wayPoints || wayPoints.length === 0) return;
        this.geometry.vertices.forEach(v => v.copy(wayPoints[0]));
        this.position.copy(wayPoints[0]);
        this.light.position.copy(wayPoints[0]);
        this.line.setGeometry(this.geometry, p => p * 0.5);
        this.startPath(wayPoints);
      }

      getTileDirections(x, y) {
        return [UP, RIGHT, DOWN, LEFT].filter(d => {
          const tile = this.map.getTileAt(x, y, d);
          return tile !== undefined && tile === MAP_DIRECTION;
        });
      }

      scaleTilePosition(position) {
        const tileScaleX = CUBE_SIZE / this.map.width;
        const tileScaleY = CUBE_SIZE / this.map.height;
        position.set(
          (position.x + tileScaleX * 1.5) * tileScaleX,
          (position.y + tileScaleX * 1.5) * tileScaleY, 0
        );
        return position;
      }

      getWayPoints() {
        const { map, junctionTiles: jTiles } = this;
        if (jTiles.length === 0) return [];
        const startTile = jTiles[~~(Math.random() * jTiles.length)];
        let [xCurrent, yCurrent] = map.getCoordsFromIndex(startTile);
        const visitedTiles = [];
        let insert = true;

        while (insert) {
          visitedTiles.push(map.getIndexFromCoords(xCurrent, yCurrent));
          const directions = this.getTileDirections(xCurrent, yCurrent);
          const neighbours = directions
            .map(d => map.getNearestNeighborFrom(xCurrent, yCurrent, d, MAP_JUNCTION))
            .filter(n => n && visitedTiles.indexOf(map.getIndexFromCoords(n[0], n[1])) === -1);

          const nPick = neighbours[~~(Math.random() * neighbours.length)];
          if (nPick) {
            [xCurrent, yCurrent] = nPick;
          } else {
            insert = false;
          }
        }

        return visitedTiles.map(idx => {
          let [x, y] = map.getCoordsFromIndex(idx);
          return this.scaleTilePosition(new THREE.Vector3(x, y, 0));
        });
      }

      updatePosition() {
        this.light.position.copy(this.position);
        this.line.advance(this.position);
      }

      startPath(waypoints) {
        this.timeline = new TimelineMax({
          onComplete: () => {
            TweenMax.to(this.position, 1, {
              onUpdate: this.updatePosition.bind(this),
              onComplete: () => {
                setTimeout(this.spawn.bind(this), Math.random() * 2000 + 400);
              }
            });
          }
        });

        waypoints.forEach((pos, idx) => {
          this.timeline.to(this.position, 0.24, {
            x: pos.x,
            y: pos.y,
            onUpdate: this.updatePosition.bind(this),
            ease: Linear.easeNone
          });

          if (idx === 0) {
            this.timeline.to(this.light, 0.2, { power: 2 * Math.PI });
          }
          if (idx === waypoints.length - 1) {
            this.timeline.to(this.light, 0.4, { power: 0.1 * Math.PI }, '-=0.4');
          }
        });
      }
    }

    class App {
      constructor() {
        this.mouse = new THREE.Vector2(0, 0);
        this.init();
        this.initLights();
        this.initMazeMesh();
        this.initTrails();
        this.initParticles();
        this.initGodRays();
        this.setupComposer();
        this.setupPostprocessing();
        this.attachEvents();
        this.updateSize();
        this.onFrame(0);
      }

      init() {
        const w = window.innerWidth, h = window.innerHeight;
        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        this.renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
        this.renderer.setSize(w, h);
        this.renderer.gammaInput = true;
        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
        this.camera.position.set(14, 14, 14);
        this.clock = new THREE.Clock();
        document.body.appendChild(this.renderer.domElement);
      }

      initLights() {
        const { scene } = this;
        scene.add(new THREE.AmbientLight(0xffffff, 0.18));
        scene.add(new THREE.PointLight(0xffffff, 0.8));
        this.outterLight = new THREE.PointLight(0xff00ff, 3.2, 28);
        this.outterLight.position.set(14, 14, 14);
        scene.add(this.outterLight);
      }

      initMazeMesh() {
        const map = new BoardMap('#map-test');
        const b = new MapBoundariesMesh(map);
        const mat = new THREE.MeshPhongMaterial({ color: 0x4f46e5, shininess: 80 });
        this.mazeMesh = new THREE.Mesh(b.geometry, mat);
        this.scene.add(this.mazeMesh);
      }

      initTrails() {
        const map = new BoardMap('#map-test');
        const t1 = new Trails(map);
        t1.group.position.set(-CUBE_SIZE / 2, CUBE_SIZE / 2 + 0.2, -CUBE_SIZE / 2);
        t1.group.rotation.x = Math.PI / 2;
        this.scene.add(t1.group);

        const t2 = new Trails(map);
        t2.group.position.set(CUBE_SIZE / 2, -CUBE_SIZE / 2, -CUBE_SIZE / 2);
        t2.group.rotation.x = Math.PI / 2;
        t2.group.rotation.y = Math.PI / 2;
        this.scene.add(t2.group);

        const t3 = new Trails(map);
        t3.group.position.set(-CUBE_SIZE / 2, -CUBE_SIZE / 2 - 0.1, CUBE_SIZE / 2);
        this.scene.add(t3.group);
      }

      initParticles() {
        this.particles = new Particles();
        this.particles.clusters.forEach(c => this.scene.add(c.points));
      }

      initGodRays() {
        const geo = new THREE.SphereGeometry(1.4, 32, 32);
        const mat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        this.lightSphere = new THREE.Mesh(geo, mat);
        this.lightSphere.layers.set(1);
        this.scene.add(this.lightSphere);
      }

      setupComposer() {
        const w = window.innerWidth, h = window.innerHeight;
        this.occlusionRenderTarget = new THREE.WebGLRenderTarget(w * 0.5, h * 0.5);
        this.occlusionComposer = new THREE.EffectComposer(this.renderer, this.occlusionRenderTarget);
        this.occlusionComposer.addPass(new THREE.RenderPass(this.scene, this.camera));

        const pVertex = document.getElementById('shader-passthrough-vertex').textContent;
        const pFrag = document.getElementById('shader-volumetric-light-fragment').textContent;

        this.occlusionPass = new THREE.ShaderPass({
          uniforms: {
            tDiffuse: { value: null },
            lightPosition: { value: new THREE.Vector2(0.5, 0.5) },
            exposure: { value: 0.18 },
            decay: { value: 0.96 },
            density: { value: 0.35 },
            weight: { value: 0.4 },
            samples: { value: 50 }
          },
          vertexShader: pVertex,
          fragmentShader: pFrag
        });
        this.occlusionPass.needsSwap = false;
        this.occlusionComposer.addPass(this.occlusionPass);
      }

      setupPostprocessing() {
        const w = window.innerWidth, h = window.innerHeight;
        this.composer = new THREE.EffectComposer(this.renderer);
        this.composer.addPass(new THREE.RenderPass(this.scene, this.camera));

        const pVertex = document.getElementById('shader-passthrough-vertex').textContent;
        const addFrag = document.getElementById('shader-additive-fragment').textContent;

        const addPass = new THREE.ShaderPass({
          uniforms: {
            tDiffuse: { value: null },
            tAdd: { value: this.occlusionRenderTarget.texture }
          },
          vertexShader: pVertex,
          fragmentShader: addFrag
        });
        addPass.renderToScreen = true;
        this.composer.addPass(addPass);
      }

      attachEvents() {
        window.addEventListener('resize', this.updateSize.bind(this));
        window.addEventListener('mousemove', e => {
          this.mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
          this.mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        // Controles de temas
        const themes = [
          { maze: 0x4f46e5, light: 0xff00ff, sphere: 0x00ffff },
          { maze: 0x005522, light: 0x00ff66, sphere: 0x39ff14 },
          { maze: 0x8b3a00, light: 0xffaa00, sphere: 0xffdd44 }
        ];
        let currentTheme = 0;
        document.getElementById('themeBtn').onclick = () => {
          currentTheme = (currentTheme + 1) % themes.length;
          const t = themes[currentTheme];
          this.mazeMesh.material.color.setHex(t.maze);
          this.outterLight.color.setHex(t.light);
          this.lightSphere.material.color.setHex(t.sphere);
        };

        document.getElementById('resetCam').onclick = () => {
          TweenMax.to(this.camera.position, 1.2, { x: 14, y: 14, z: 14 });
        };
      }

      updateSize() {
        const w = window.innerWidth, h = window.innerHeight;
        this.renderer.setSize(w, h);
        this.camera.aspect = w / h;
        this.camera.updateProjectionMatrix();
        this.composer.setSize(w, h);
        this.occlusionComposer.setSize(w, h);
      }

      updateCameraTilt() {
        TweenMax.to(this.camera.position, 1.5, {
          x: 14 + this.mouse.x * 3.5,
          y: 14 + this.mouse.y * 3.5,
          z: 14 + this.mouse.x * this.mouse.y
        });
      }

      onFrame(time) {
        requestAnimationFrame(this.onFrame.bind(this));
        this.camera.layers.set(1);
        this.updateCameraTilt();
        this.particles.update(this.clock.getDelta());

        const n0 = (noise.perlin2(time * 0.0005, 0) + 1) * 0.5;
        this.lightSphere.position.y = THREE.Math.lerp(-1.2, 1.2, n0);

        this.renderer.setClearColor(0x000000, 0);
        this.occlusionComposer.render();

        this.camera.layers.set(0);
        this.camera.lookAt(this.scene.position);
        this.composer.render();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.app = new App();
    });
  </script>
</body>
</html>
