<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C7Dev — Árbol de Partículas SVG Animado</title>
  <meta name="author" content="C7Dev">
  <meta name="description" content="Árbol fractal vectorial y estelar animado con SVG puro, gradientes dinámicos y partículas reactivas.">
  <style>
    :root {
      --gold: #ffd700;
      --cyan: #00ffd5;
      --violet: #bf40bf;
      --green: #39ff14;
      --glow-color: #ffd700;
    }
    * { box-sizing: border-box; }
    body {
      height: 100vh;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #070a14 0%, #010206 100%);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
    }
    #particle-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .tree-container {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.25));
      transition: filter 0.5s ease;
    }
    svg {
      max-height: 68vh;
      width: 90vw;
      overflow: visible;
    }
    .hojas-arbol {
      fill: var(--gold);
      stroke: var(--gold);
      stroke-width: 0.25;
      transform: scale(0);
      transform-origin: 50% 50%;
      transform-box: fill-box;
      animation:
        hojasAnimacion 8s ease-in-out infinite,
        coloresArbol 24s steps(1) infinite;
      animation-delay: calc(var(--no) * 0.025s);
      transition: fill 0.4s ease, stroke 0.4s ease;
    }
    .estrella-superior {
      fill: #ffffff;
      stroke: var(--gold);
      stroke-width: 0.3;
      transform: scale(0);
      transform-origin: 50% 50%;
      transform-box: fill-box;
      animation: estrellaAnimacion 8s ease-in-out infinite;
      filter:
        drop-shadow(0 0 8px var(--glow-color))
        drop-shadow(0 0 18px var(--glow-color));
    }
    @keyframes hojasAnimacion {
      0% {
        transform: scale(0);
        animation-timing-function: cubic-bezier(.74, 1.72, .57, 1.01);
      }
      12% {
        transform: scale(1);
      }
      65% {
        transform: translateY(0) scale(1);
      }
      75% {
        transform: translateY(45px) scale(0);
      }
      100% {
        transform: translateY(0) scale(0);
      }
    }
    @keyframes estrellaAnimacion {
      0%, 28% {
        transform: scale(0) rotate(0deg);
        opacity: 0;
      }
      34% {
        transform: scale(0) rotate(90deg);
        opacity: 1;
        animation-timing-function: cubic-bezier(.74, 1.72, .57, 1.01);
      }
      46%, 90% {
        transform: scale(1.6) rotate(360deg);
        opacity: 1;
      }
      98%, 100% {
        transform: scale(0) rotate(720deg);
        opacity: 0;
      }
    }
    @keyframes coloresArbol {
      0%   { fill: #ffd700; stroke: #ffd700; }
      25%  { fill: #00ffd5; stroke: #00ffd5; }
      50%  { fill: #bf40bf; stroke: #bf40bf; }
      75%  { fill: #39ff14; stroke: #39ff14; }
      100% { fill: #ffd700; stroke: #ffd700; }
    }
    .c7dev-badge {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(10, 15, 25, 0.7);
      border: 1px solid rgba(255, 215, 0, 0.3);
      backdrop-filter: blur(10px);
      color: #ffd700;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      z-index: 10;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
    }
    .palette-switcher {
      position: fixed;
      bottom: 20px;
      display: flex;
      gap: 10px;
      background: rgba(10, 15, 25, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 30px;
      padding: 6px 12px;
      backdrop-filter: blur(10px);
      z-index: 10;
    }
    .palette-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4);
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s;
    }
    .palette-btn:hover {
      transform: scale(1.2);
      border-color: #fff;
    }
    .attribution {
      position: fixed;
      bottom: 20px;
      left: 20px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      z-index: 10;
    }
  </style>
</head>

  <script>
    // Sistema de partículas reactivas de fondo
    const canvas = document.getElementById('particle-bg');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const particles = [];
    let currentColor = '#ffd700';

    for (let i = 0; i < 65; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 2 + 0.8,
        vx: (Math.random() - 0.5) * 0.4,
        vy: -Math.random() * 0.8 - 0.2,
        alpha: Math.random() * 0.7 + 0.3,
        pulse: Math.random() * 0.05
      });
    }

    let mouseX = width / 2;
    let mouseY = height / 2;
    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    function drawParticles() {
      ctx.clearRect(0, 0, width, height);

      for (let p of particles) {
        p.y += p.vy;
        p.x += p.vx;

        // Leve atracción magnética hacia el cursor
        const dx = mouseX - p.x;
        const dy = mouseY - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120) {
          p.x += (dx / dist) * 0.8;
          p.y += (dy / dist) * 0.8;
        }

        if (p.y < 0) {
          p.y = height + 10;
          p.x = Math.random() * width;
        }
        if (p.x < 0) p.x = width;
        if (p.x > width) p.x = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = currentColor;
        ctx.globalAlpha = p.alpha;
        ctx.shadowColor = currentColor;
        ctx.shadowBlur = 8;
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(drawParticles);
    }
    drawParticles();

    // Selector interactivo de color
    const buttons = document.querySelectorAll('.palette-btn');
    const treeBox = document.getElementById('treeBox');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        const color = btn.getAttribute('data-color');
        currentColor = color;
        document.documentElement.style.setProperty('--glow-color', color);
        treeBox.style.filter = `drop-shadow(0 0 30px ${color}66)`;

        const leaves = document.querySelectorAll('.hojas-arbol');
        leaves.forEach(leaf => {
          leaf.style.animation = 'hojasAnimacion 8s ease-in-out infinite';
          leaf.style.animationDelay = `calc(var(--no) * 0.025s)`;
          leaf.style.fill = color;
          leaf.style.stroke = color;
        });

        const star = document.querySelector('.estrella-superior');
        star.style.stroke = color;
      });
    });
  </script>
