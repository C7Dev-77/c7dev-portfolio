<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C7Dev — Rosa Holográfica Animada con Partículas</title>
  <meta name="author" content="C7Dev">
  <meta name="description" content="Rosa vectorial holográfica con animación de resplandor, lluvia de pétalos 3D en canvas y partículas interactivas.">
  <style>
    :root {
      --primary: #ff007f;
      --secondary: #ff3399;
      --gold: #ffd700;
      --bg: #0b030b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 40%, #200418 0%, #080208 100%);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
    }

    #petals-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .c7dev-badge {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 22px;
      border-radius: 999px;
      background: rgba(20, 5, 18, 0.7);
      border: 1px solid rgba(255, 0, 127, 0.4);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.3);
      color: #ff99cc;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      z-index: 10;
    }

    .rose-stage {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: floatFlower 4s ease-in-out infinite alternate;
    }

    @keyframes floatFlower {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-16px) rotate(1deg); }
    }

    .rose-svg {
      width: 280px;
      height: 380px;
      filter: drop-shadow(0 0 25px rgba(255, 0, 127, 0.5)) drop-shadow(0 0 45px rgba(255, 0, 127, 0.25));
      transition: filter 0.4s ease;
    }

    /* Destellos de luz */
    .sparkle {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 12px #ff99cc, 0 0 24px #ff007f;
      animation: sparkleAnim 2s infinite ease-in-out;
      pointer-events: none;
    }
    @keyframes sparkleAnim {
      0%, 100% { transform: scale(0.3) rotate(0deg); opacity: 0.2; }
      50% { transform: scale(1.3) rotate(45deg); opacity: 1; }
    }

    /* Mensaje dinámico */
    .message-container {
      position: relative;
      z-index: 10;
      margin-top: 10px;
      text-align: center;
      max-width: 90%;
    }
    .message-title {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 15px rgba(255, 0, 127, 0.8);
      margin: 0 0 6px 0;
      letter-spacing: 1px;
    }
    .message-phrase {
      font-size: 16px;
      color: #ffb3d9;
      text-shadow: 0 0 10px rgba(255, 0, 127, 0.6);
      margin: 0;
      min-height: 24px;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .controls-bar {
      position: fixed;
      bottom: 24px;
      display: flex;
      gap: 12px;
      background: rgba(20, 5, 18, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 8px 18px;
      backdrop-filter: blur(12px);
      z-index: 10;
    }
    .ctrl-btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 0, 127, 0.35);
      background: rgba(255, 0, 127, 0.12);
      color: #fff;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .ctrl-btn:hover {
      background: rgba(255, 0, 127, 0.3);
      border-color: #ff007f;
      box-shadow: 0 0 14px rgba(255, 0, 127, 0.5);
    }

    .attribution {
      position: fixed;
      bottom: 24px;
      left: 24px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      z-index: 10;
    }
    .hint {
      position: fixed;
      bottom: 24px;
      right: 24px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      z-index: 10;
    }
  </style>
</head>
<body>
  <canvas id="petals-canvas"></canvas>

  <div class="c7dev-badge">✦ C7DEV HOLOGRAPHIC ROSE ✦</div>

  <div class="rose-stage" id="roseStage">
    <!-- SVG Vectorial Orgánico de Rosa Iluminada -->
    <svg class="rose-svg" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="roseGlow" cx="50%" cy="40%" r="60%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="35%" stop-color="#ff1a8c"/>
          <stop offset="70%" stop-color="#b30059"/>
          <stop offset="100%" stop-color="#4d0026"/>
        </radialGradient>
        <radialGradient id="outerPetal" cx="40%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#ff3399"/>
          <stop offset="50%" stop-color="#e60073"/>
          <stop offset="100%" stop-color="#800040"/>
        </radialGradient>
        <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00ff88"/>
          <stop offset="50%" stop-color="#00994d"/>
          <stop offset="100%" stop-color="#00331a"/>
        </linearGradient>
      </defs>

      <!-- Tallo elegante -->
      <path d="M 150 180 Q 140 260 160 360 Q 165 380 170 395" stroke="url(#stemGrad)" stroke-width="7" fill="none" stroke-linecap="round"/>
      
      <!-- Hojas del tallo con nervaduras -->
      <path d="M 148 240 Q 110 235 90 260 Q 120 275 145 252" fill="url(#stemGrad)" opacity="0.95"/>
      <path d="M 156 280 Q 200 270 220 295 Q 185 315 158 290" fill="url(#stemGrad)" opacity="0.95"/>

      <!-- Pétalos exteriores -->
      <path d="M 100 130 C 80 80 140 50 150 80 C 160 50 220 80 200 130 C 230 180 180 210 150 215 C 120 210 70 180 100 130 Z" fill="url(#outerPetal)" opacity="0.9"/>
      <path d="M 115 110 C 105 70 150 55 155 75 C 170 55 205 70 195 110 C 215 150 175 185 150 190 C 125 185 85 150 115 110 Z" fill="url(#roseGlow)"/>

      <!-- Pétalos envolventes del corazón -->
      <path d="M 130 100 C 125 75 160 70 165 85 C 175 75 190 85 180 110 C 190 135 165 155 150 160 C 135 155 110 135 130 100 Z" fill="#ff007f"/>
      <path d="M 138 92 C 142 80 162 80 164 92 C 168 105 158 120 150 125 C 142 120 132 105 138 92 Z" fill="#ffffff" opacity="0.85"/>
    </svg>

    <!-- Puntos de brillo flotantes -->
    <div class="sparkle" style="top: 20%; left: 25%;"></div>
    <div class="sparkle" style="top: 35%; right: 22%; animation-delay: 0.6s;"></div>
    <div class="sparkle" style="top: 15%; right: 35%; animation-delay: 1.2s;"></div>
    <div class="sparkle" style="top: 50%; left: 30%; animation-delay: 0.9s;"></div>
  </div>

  <div class="message-container">
    <h1 class="message-title">✦ Arte & Inspiración ✦</h1>
    <p class="message-phrase" id="frase">La belleza de la creación vive en cada detalle digital.</p>
  </div>

  <div class="controls-bar">
    <button class="ctrl-btn" id="petalBtn">🌸 Lluvia de Pétalos</button>
    <button class="ctrl-btn" id="colorBtn">🎨 Cambiar Tono</button>
  </div>

  <div class="attribution">&copy; C7Dev &bull; Vector Glow Bloom</div>
  <div class="hint">✦ Haz clic para crear un destello ✦</div>

  <script>
    // Frases elegantes y profesionales
    const frases = [
      "La belleza de la creación vive en cada detalle digital.",
      "Transformando ideas abstractas en experiencias extraordinarias.",
      "La pasión y el código se fusionan en perfecta armonía.",
      "Donde el diseño encuentra su máxima expresión visual.",
      "Cada línea de código es un trazo en este lienzo infinito.",
      "Innovación constante, elegancia sin límites."
    ];

    let fIndex = 0;
    const fraseEl = document.getElementById('frase');
    setInterval(() => {
      fIndex = (fIndex + 1) % frases.length;
      fraseEl.style.opacity = '0';
      fraseEl.style.transform = 'translateY(6px)';
      setTimeout(() => {
        fraseEl.textContent = frases[fIndex];
        fraseEl.style.opacity = '1';
        fraseEl.style.transform = 'translateY(0)';
      }, 350);
    }, 4000);

    // Sistema de pétalos en canvas
    const canvas = document.getElementById('petals-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const petals = [];
    function spawnPetal(customX, customY) {
      petals.push({
        x: customX !== undefined ? customX : Math.random() * width,
        y: customY !== undefined ? customY : -20,
        size: Math.random() * 12 + 8,
        speedY: Math.random() * 1.5 + 1,
        speedX: (Math.random() - 0.5) * 1.2,
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.04,
        alpha: Math.random() * 0.5 + 0.5,
        color: petalColors[Math.floor(Math.random() * petalColors.length)]
      });
    }

    let petalColors = ['#ff007f', '#ff3399', '#e6005c', '#ff66b2', '#ff99cc'];

    for (let i = 0; i < 35; i++) {
      spawnPetal(Math.random() * width, Math.random() * height);
    }

    function drawPetals() {
      ctx.clearRect(0, 0, width, height);

      for (let i = petals.length - 1; i >= 0; i--) {
        const p = petals[i];
        p.y += p.speedY;
        p.x += p.speedX + Math.sin(p.y * 0.02) * 0.5;
        p.rotation += p.rotSpeed;

        if (p.y > height + 20) {
          p.y = -20;
          p.x = Math.random() * width;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 6;

        ctx.beginPath();
        ctx.ellipse(0, 0, p.size, p.size * 0.6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      requestAnimationFrame(drawPetals);
    }
    drawPetals();

    // Botones de control
    document.getElementById('petalBtn').onclick = () => {
      for (let i = 0; i < 20; i++) spawnPetal();
    };

    const themes = [
      { glow: '#ff007f', drop: 'rgba(255, 0, 127, 0.5)' },
      { glow: '#9933ff', drop: 'rgba(153, 51, 255, 0.5)' },
      { glow: '#00e5ff', drop: 'rgba(0, 229, 255, 0.5)' },
      { glow: '#ffd700', drop: 'rgba(255, 215, 0, 0.5)' }
    ];
    let themeIdx = 0;
    document.getElementById('colorBtn').onclick = () => {
      themeIdx = (themeIdx + 1) % themes.length;
      const t = themes[themeIdx];
      document.querySelector('.rose-svg').style.filter = `drop-shadow(0 0 25px ${t.drop})`;
    };

    // Destello de chispas en clic
    window.addEventListener('click', (e) => {
      if (e.target.closest('.controls-bar')) return;
      for (let i = 0; i < 5; i++) {
        spawnPetal(e.clientX + (Math.random() - 0.5) * 30, e.clientY + (Math.random() - 0.5) * 30);
      }
    });
  </script>
</body>
</html>
