<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>Carta de Amor</title>
  <style>
	@import url(https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap);
    @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');

.address,
.address * {
  font-family: Arial, sans-serif !important;
}
body  {
	font-family: "Great Vibes", cursive;
	background: linear-gradient(to bottom right, #ffecec, #fff5f5, #ffebeb);
	color: #333;
	display: flex;
	justify-content: center;
	align-items: center;
	min-height: 100vh;
	margin: 0;
	padding: 1rem;
	margin-top: 50px;
	overflow: hidden;
	-webkit-tap-highlight-color: transparent;
  }
.envelope {
	--duration: 1000ms;

	--shadow-width: calc(var(--envelope-width) * 0.85);
	--shadow-blur: 15px;

	--envelope-width: 300px;
	--envelope-height: 175px;
	--envelope-clr-bg: #d14d44;
	--envelope-clr-bg-side: #c24e46;
	--envelope-clr-bg-bottom: #e15349;
	--envelope-clr-bg-top: #d14d44;
	--envelope-clr-txt: #fff;

	/*--envelope-transform: rotateY(0deg);*/
	--envelope-transform-hover: rotateY(180deg);
	--evelope-rotate-delay: calc(var(--duration) / 1);
	--evelope-rotate-delay-hover: 0ms;

	--letter-clr-bg: #fff;
	--letter-clr-text: #c0392b;
	--letter-font-size: 1rem;
	--letter-delay: 0ms;
	--letter-delay-hover: calc(
		var(--duration) * 1.25
	);

	--letter-height: calc(var(--envelope-height) - 2rem);
	--letter-height-hover: calc(var(--envelope-height) * 1.75);

	--fold-rotate: rotateX(0deg);
	/*--fold-zindex: 10;*/
	--fold-zindex-hover: 0;
	--fold-rotate-hover: rotateX(180deg);
	--fold-delay: calc(var(--duration) / 2);
	--fold-delay-hover: calc(var(--duration) * .75);

	--front-font-size: 1rem;
	--snowman-width: 50px;
	--bells-width: 30px;

	position: relative;
	height: var(--envelope-height);
	width: var(--envelope-width);
	perspective: 1000px;
	cursor: pointer;
}

@media (min-width: 720px) {
	.envelope {
		--envelope-width: 600px;
		--envelope-height: 350px;
		--letter-font-size: 1.6rem;
		--snowman-width: 130px;
		--bells-width: 60px;
		--front-font-size: 1.25rem;
	}
}

.envelope::after {
	content: "";
	position: absolute;
	top: 110%;
	left: 50%;
	width: var(--shadow-width);
	height: 40px;
	transition: var(--duration) ease-in-out;
	transition-delay: var(--evelope-rotate-delay);
	transform: var(--shadow-transform);
	translate: -50% 0;
	border-radius: 50%;
	background: rgba(56, 6, 6, 0.4);
	filter: blur(var(--shadow-blur));
}

.envelope:hover {
	--envelope-transform: var(--envelope-transform-hover, 0deg);
	--evelope-rotate-delay: var(--evelope-rotate-delay-hover);
	--shadow-transform: rotateY(180deg);
	--fold-rotate: var(--fold-rotate-hover);
	--fold-delay: var(--fold-delay-hover);
	--fold-zindex: var(--fold-zindex-hover);
	--letter-height: var(--letter-height-hover);
	--letter-delay: var(--letter-delay-hover);
}

.envelope-inner {
	position: relative;
	width: 100%;
	height: 100%;

	transition: var(--duration) ease-in-out;
	transition-delay: var(--evelope-rotate-delay);
	transform-style: preserve-3d;
	transform: var(--envelope-transform);
	display: grid;
}

.envelope-front,
.envelope-back {
	position: relative;
	grid-area: 1/1;
	width: 100%;
	height: 100%;
	background-color: var(--envelope-clr-bg);
	-webkit-backface-visibility: hidden;
	backface-visibility: hidden;
	perspective: 1000px;
	isolation: isolate;
}

.envelope-front {
	color: var(--envelope-clr-txt);
	display: grid;
	place-content: center;
}
.envelope-front .postage-stamp {
	position: absolute;
	top: 1em;
	right: 0.5em;
	width: 15%;
}
.envelope-front .address {
	text-align: left;
	font-size: var(--front-font-size);
}
.envelope-front .address > p > span:first-child {
	font-weight: 200;
}
.envelope-front .address > p > span:last-of-type {
	font-weight: 800;
}

.envelope-back {

	transform: rotateY(180deg);
}

.envelope-back::after {
	content: "";
	position: absolute;
	inset: 0;
	z-index: 3;
	background-image: conic-gradient(
		transparent 60deg,
		var(--envelope-clr-bg-side) 60deg 120deg,
		var(--envelope-clr-bg-bottom) 120deg 240deg,
		var(--envelope-clr-bg-side) 240deg 300deg,
		transparent 300deg
	);
}

.envelope-back .top-fold {
	position: absolute;
	inset: 0;
	z-index: var(--fold-zindex, 10);
	background-color: var(--envelope-clr-bg-top);
	clip-path: polygon(0% 0%, 50% 55%, 100% 0%);

	transform: var(--fold-rotate);
	transform-origin: top;
	transition: var(--duration) ease-in-out;
	transition-delay: var(--fold-delay);
}

.nombre {
  font-family: inherit;
}

.letter {
	position: absolute;
	bottom: 5px;
	left: 50%;
	width: 70%;
	height: var(--letter-height);
	font-size: var(--letter-font-size);
	transform: translateX(-50%);
	background: var(--letter-clr-bg);
	z-index: 2;
	padding: 2em 3em;
	display: flex;
	flex-direction: column;
	gap: 1rem;
	align-items: center;
	text-align: center;
	transition: var(--duration) ease-in-out;
	transition-delay: var(--letter-delay);
	overflow: hidden;
}
.letter > svg.snowman {
	width: var(--snowman-width);
}
.letter svg.bells {
	width: var(--bells-width);
	color: orange;
}
.letter p {
	margin: 0;
	font-weight: bold;
	width: 32ch;
	color: var(--letter-clr-text);
}

.custom-image {
    width: 100px;
    height: 100px;
    object-fit: contain; 
}
.custom-image2 {
    width: 150px;
    height: 150px;
    object-fit: contain; 
}

.highlight {
    display: block; 
    margin-top: 10px; 
    font-size: 1.8rem;  
    font-weight: bold; 
}
.postage-stamp{
  position: absolute;
  top: 1em;
  right: 0.5em;
  width: 50px;
  height: 50px;
  z-index: 5;
}

.postage-stamp img{
  width: 100%;
  height: 200%;
  object-fit: cover;
}
  </style>

</head>
<body>

<div class="envelope">
	<div class="envelope-inner">
		<div class="envelope-front">
			<div class="postage-stamp">
  <img src="https://media.tenor.com/pmDABQ5c8ZwAAAAi/sappy-sappy-seals.gif" alt="stamp">
</div>
			<div class="address">
    <p><span>Para:</span> <span>Mi Bebé ❤️</span></p>
    <p><span>De:</span> <span>Rafael💌</span></p>
</div>
		</div>
		<div class="envelope-back">
			<div class="top-fold"></div>

			<div class="letter">
				<img src="https://cdn-icons-png.flaticon.com/256/9553/9553169.png" alt="love1" class="custom-image">
				<p>Desde que llegaste a mi vida todo cambió para bien,  mis días tienen más luz y mi corazón más calma,  y <span class="highlight">
					te amo</span>.</p>
				<img src="https://cdn.pixabay.com/photo/2024/05/11/16/04/couple-8755220_1280.jpg" alt="love2" class="custom-image2">
			
			</div>
			
		</div>
	</div>
</div>
</body>
</html>
