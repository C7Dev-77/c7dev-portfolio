<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Esfera del Dragón</title>
  <style>
    body {
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: #ffffff;
  height: 100vh;
  margin: 0;
  
}

.dragon-ball {
  position: relative;
  width: 200px;
  height: 200px;
  background: radial-gradient(circle at 30% 30%, #ffa500, #ff4500);
  border-radius: 50%;
  box-shadow:inset 0 0 20px rgb(255, 98, 0);
}

.star {
  position: absolute;
  width: 30px;
  height: 30px;
  background-color: #ff0000;
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
 transform-origin: center center;
 ;
}

.star:nth-child(1){
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(1.2);
}
.star:nth-child(2){
  top: 30%;
  left: 30%;
  transform: translate(-50%, -50%);
}

.star:nth-child(3){
  top: 30%;
  left: 70%;
  transform: translate(-50%, -50%);
}
.star:nth-child(4){
  top: 70%;
  left: 30%;
  transform:translate(-50%, -50%);
}
.star.star:nth-child(5){
  top: 70%;
  left: 70%;
  transform: translate(-50%, -50%);
}

.star:nth-child(6){
  top: 50%;
  left: 20%;
  transform: translate(-50%, -50%);

}
.star:nth-child(7){
top: 50%;
left:80%;
 transform: translate(-50%, -50%);

}

/* Brillo interno pulsante */
    .dragon-ball::before {
      content: "";
      position: absolute;
      top: 10%;
      left: 15%;
      width: 70%;
      height: 70%;
      background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.8), transparent 70%);
      border-radius: 50%;
      filter: blur(10px);
      opacity: 0.7;
      animation: pulse 4s infinite alternate;
    }
 .dragon-ball::before {
      content: "";
      position: absolute;
      top: 10%;
      left: 15%;
      width: 70%;
      height: 70%;
      background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.8), transparent 70%);
      border-radius: 50%;
      filter: blur(10px);
      opacity: 0.7;
      animation: pulse 4s infinite alternate;
    }

    /* Reflejo tipo cristal */
    .dragon-ball::after {
      content: "";
      position: absolute;
      top: 10px;
      left: 20px;
      width: 160px;
      height: 60px;
      background: radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.9), transparent 70%);
      border-radius: 50%;
      filter: blur(8px);
      opacity: 0.8;
      transform: rotate(-20deg);
    }
    .dragon-logo {
  position: absolute;
  top: -60%;
  left: 50%;
  width: 220px;       /* puedes ajustar el tamaño */
  transform: translate(-50%, -50%);
}

.zoom {
  animation: zoomSmooth 1.5s ease-in-out;
}

@keyframes zoomSmooth {
  0% {
    transform: scale(1);
    box-shadow:
      0 0 0 rgba(255, 180, 0, 0);
  }
  50% {
    transform: scale(1.25);
    box-shadow:
      0 0 60px rgba(255, 179, 0, 0),
      0 0 120px rgba(255, 102, 0, 0);
  }
  100% {
    transform: scale(1);
    box-shadow:
      0 0 0 rgba(255, 180, 0, 0);
  }
}

  </style>
</head>
<body>
    <div class="dragon-ball" id="dragon-ball">
    <img src="https://i.postimg.cc/pdrQzFfJ/dragonballsuper.png" class="dragon-logo">

  <div class="dragon-ball">
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="shine"></div>
  </div>
   <script>
    const ball = document.getElementById("dragon-ball");

    ball.addEventListener("click", () => {
      ball.classList.add("zoom");
      setTimeout(() => {
        ball.classList.remove("zoom");
      }, 1500); // duración del zoom
    });
  </script>
</body>
</html>
